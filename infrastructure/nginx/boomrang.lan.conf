# =============================================================================
# infrastructure\nginx\boomrang.lan.conf
#
# This is a TEMPLATE, not the live config nginx actually reads. On every run,
# ops\start.bat calls ops\nginx-setup.js, which:
#   - copies this file into C:\nginx\conf\boomrang.lan.conf
#   - replaces __APP_PORT__ with PORT from backend\.env and __FRONTEND_PORT__
#     with FRONTEND_PORT from frontend\.env (so both upstreams always match the
#     two Windows services, even after ops\change-port.bat changes them)
#   - makes sure C:\nginx\conf\nginx.conf has an `include boomrang.lan.conf;`
#     line so this file is actually loaded
#
# nginx is the single public entry point:
#   /api/* and /socket.io/*  -> backend service  (BoomrangChatBackend)
#   everything else          -> frontend service (BoomrangChatFrontend)
#
# Do not hardcode port numbers here - keep both placeholders as-is so they keep
# being filled in automatically. Edit everything else (server_name, TLS
# settings, timeouts, etc.) freely; those changes are preserved on every sync.
#
# This is the HTTPS variant and requires a certificate + key at
# C:\nginx\ssl\boomrang.lan.crt / .key. ops\nginx-setup.js supplies those
# automatically (a real one from infrastructure\ca if you've generated it, or
# an auto-generated temporary self-signed one otherwise - see its own output
# for which one is in use). If neither OpenSSL nor a real certificate is
# available at all, ops\nginx-setup.js deploys
# boomrang.lan.http-only.conf instead of this file.
# =============================================================================

upstream boomrang_backend {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

upstream boomrang_frontend {
    server 127.0.0.1:__FRONTEND_PORT__;
    keepalive 16;
}

map $http_upgrade $boomrang_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name __SERVER_NAMES__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name __SERVER_NAMES__;

    ssl_certificate     C:/nginx/ssl/boomrang.lan.crt;
    ssl_certificate_key C:/nginx/ssl/boomrang.lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 0;
    proxy_buffering off;

    proxy_http_version 1.1;

    location /socket.io/ {
        proxy_pass http://boomrang_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $boomrang_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://boomrang_backend;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://boomrang_frontend;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
