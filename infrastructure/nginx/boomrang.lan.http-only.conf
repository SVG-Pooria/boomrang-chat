# =============================================================================
# infrastructure\nginx\boomrang.lan.http-only.conf
#
# Fallback TEMPLATE used automatically by ops\nginx-setup.js only when it
# could not find OpenSSL AND could not find any certificate (neither a real
# one from infrastructure\ca\output nor an existing one in C:\nginx\ssl) to
# put in place. Same rules as boomrang.lan.conf: keep __APP_PORT__ and
# __FRONTEND_PORT__ as placeholders, everything else can be edited freely.
# Same routing too: /api/* and /socket.io/* go to the backend service,
# everything else goes to the frontend service.
#
# This serves the app over plain HTTP on port 80 - no certificate needed, so
# it always works, but traffic between employees' browsers and this server is
# NOT encrypted. As soon as either of these becomes true, ops\start.bat will
# automatically switch back to the encrypted boomrang.lan.conf on its
# next run - nothing to do by hand:
#   - OpenSSL is installed and available in PATH (a temporary self-signed
#     certificate will then be generated automatically), or
#   - infrastructure\ca\generate-root-ca.bat and generate-server-cert.bat have
#     been run (a real, network-trusted certificate will then be picked up
#     automatically from infrastructure\ca\output)
# =============================================================================

upstream boomrang_backend {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

upstream boomrang_frontend {
    server 127.0.0.1:__FRONTEND_PORT__;
    keepalive 16;
}

map $http_upgrade $boomrang_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name __SERVER_NAMES__;

    client_max_body_size 0;
    proxy_buffering off;

    proxy_http_version 1.1;

    location /socket.io/ {
        proxy_pass http://boomrang_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $boomrang_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://boomrang_backend;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://boomrang_frontend;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
